<!--
  The site's mark: a drawing sheet with its title block, which is what every
  page here already is. Three shapes and no more, because the size that has to
  work is 16px, and a browser tab is the smallest sheet in the set.

  It carries the blueprint ground rather than flipping ink with the reader's OS
  theme. A tab bar is not the sheet, so there is no theme here to follow, and an
  outline that inverts is an outline that disappears whenever a browser's tab
  bar and the OS disagree. The ground also buys the contrast the 16px version
  needs: pale lines on #0d2340 hold at one pixel, an unfilled outline does not.

  The two colours are the blueprint theme's paper and ink, from the tokens in
  design-system.css. They are stated literally because an SVG served out of
  /public is its own document and cannot read a custom property off the site.
  Note for anyone editing this file: a comment here cannot contain a doubled
  hyphen, so the tokens are named in words rather than written out. An SVG that
  breaks that rule is not malformed-looking, it simply does not parse, and the
  tab silently falls back to the .ico.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0d2340"/>
  <rect x="3" y="6" width="26" height="20" fill="none" stroke="#c8d8ec" stroke-width="2.5"/>
  <rect x="19" y="19.5" width="8.75" height="5.25" fill="#c8d8ec"/>
</svg>
